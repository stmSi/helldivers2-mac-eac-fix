name: Check installer and documentation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shell and Python syntax
        run: |
          bash -n install.command configure-fx.command scripts/build-fx-shortcut.sh
          sh -n guest/build-fex.sh guest/dependencies.sh
          python3 -m py_compile scripts/fx_guest.py scripts/setup.py guest/install_fex.py
      - name: Test runtime backup, rollback, restore and documentation
        run: python3 -m unittest discover -s tests -v
